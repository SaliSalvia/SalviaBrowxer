# Project wide properties
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Gradle
# R8 needs real headroom: 2 GB sandbox OOM-kills it; GH runners (7 GB) are fine.
# Parallel is off so Kotlin/R8 daemons don't compete for memory during assembleRelease.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true

# Kotlin
kotlin.version=1.9.22

# Compose
compose_version=1.6.0

# Android
compileSdk=34
targetSdk=34
minSdk=24

# Room
room_version=2.6.1

# Lifecycle
lifecycle_version=2.7.0

# Navigation
navigation_version=2.7.7

# WorkManager
work_version=2.9.0

# OkHttp
okhttp_version=4.12.0

# Coroutines
coroutines_version=1.7.3

# DataStore
datastore_version=1.0.0