# Project wide properties
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Gradle
# R8 needs headroom: a 2 GB sandbox OOM-kills the daemon, GH runners (7 GB) are fine.
# Parallel is off so Kotlin/R8 daemons don't compete for memory during assembleRelease.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# Cap the Kotlin daemon explicitly so it can't add a second multi-GB heap on top.
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true

# Toolchain (versions are applied in the root/app build scripts)
kotlin.version=2.0.21
agp.version=8.9.1
compose_bom_version=2024.12.01

# Android
compileSdk=36
targetSdk=36
minSdk=24

# Room
room_version=2.6.1

# Lifecycle
lifecycle_version=2.8.7

# Navigation
navigation_version=2.8.5

# OkHttp
okhttp_version=4.12.0

# Coroutines
coroutines_version=1.7.3

# DataStore
datastore_version=1.1.1