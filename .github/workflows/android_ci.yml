name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version

      - name: Verify Gradle wrapper
        run: |
          set -o pipefail
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "gradle/wrapper/gradle-wrapper.jar is missing"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.properties || { echo "gradle/wrapper/gradle-wrapper.properties is missing"; exit 1; }
          unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null
          unzip -l gradle/wrapper/gradle-wrapper.jar | grep -q 'org/gradle/wrapper/GradleWrapperMain.class'
          grep -q '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print Gradle version
        run: ./gradlew --version --no-daemon

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon --warning-mode all 2>&1 | tee gradle-test.log

      - name: Publish test failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          log = Path("gradle-test.log")
          text = log.read_text(errors="replace") if log.exists() else "gradle-test.log missing"
          errors = [ln for ln in text.splitlines()
                    if "FAILED" in ln or "> Task" in ln and "FAILED" in ln
                    or ln.startswith("e:") or "error:" in ln
                    or "Unresolved reference" in ln or "Compilation error" in ln]
          fail = text[text.rfind("FAILURE:"):] if "FAILURE:" in text else ""
          chunk = "\n".join(errors[-80:] + ["", fail[:2000]])
          Path("gradle-test-failure.txt").write_text(chunk)
          print("----- GRADLE TEST FAILURE -----")
          print(chunk)
          for line in chunk.splitlines()[:80]:
              safe = line.replace("%", "%25").replace("\r", "")
              print(f"::error title=Gradle-test::{safe}")
          for xml in Path(".").rglob("test-results/testDebugUnitTest/*.xml"):
              try:
                  root = ET.parse(xml).getroot()
              except Exception:
                  continue
              for tc in root.iter("testcase"):
                  for failure in tc.findall("failure"):
                      name = f"{tc.get('classname')}.{tc.get('name')}"
                      detail = (failure.get("message") or "") + "\n" + (failure.text or "")
                      detail = detail[:1200].replace("%", "%25").replace("\r", "")
                      print(f"::error title=Test::{name}::{detail}")
          PY
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body "$(printf 'Gradle unit tests failed:\n\n```\n%s\n```\n' "$(cat gradle-test-failure.txt)")" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --warning-mode all 2>&1 | tee gradle-build.log

      - name: Publish Gradle failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path("gradle-build.log")
          text = log.read_text(errors="replace") if log.exists() else "gradle-build.log missing"
          errors = [ln for ln in text.splitlines() if ln.startswith("e:") or "Unresolved reference" in ln or "error: " in ln]
          fail = text[text.rfind("FAILURE:"):] if "FAILURE:" in text else ""
          chunk = "\n".join(errors[-80:] + ["", fail[:2000]])
          Path("gradle-failure.txt").write_text(chunk)
          print("----- GRADLE FAILURE -----")
          print(chunk)
          for line in chunk.splitlines()[:80]:
              safe = line.replace("%", "%25").replace("\r", "")
              print(f"::error title=Gradle::{safe}")
          PY
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body "$(printf 'Gradle assembleDebug failed:\n\n```\n%s\n```\n' "$(cat gradle-failure.txt)")" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify debug APK output
        if: success()
        run: |
          ls -l app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk || { echo "app-debug.apk was not produced"; exit 1; }

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: salviabrowxer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
