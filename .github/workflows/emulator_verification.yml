name: Emulator verification

# On-device verification of the parts that cannot run on the JVM: the container rewrite
# (`MediaRemuxer`), the audio/video mux (`TrackMerger`) and the real media-store publish
# (`MediaStoreExporter`). These need the platform codecs and a real MediaStore, so they only ever
# run on an emulator or a connected phone.
#
# This workflow exists because a sandbox without /dev/kvm cannot boot an emulator at all; GitHub's
# runners can, so the check lives here.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/**'
      - 'media/**'
      - 'core/**'
      - 'gradle/**'
      - '.github/workflows/emulator_verification.yml'

permissions:
  contents: read

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented tests and a launch smoke check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.salvia.salviabrowxer/.MainActivity
            sleep 8
            echo "--- app process ---"
            adb shell pidof com.salvia.salviabrowxer

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
