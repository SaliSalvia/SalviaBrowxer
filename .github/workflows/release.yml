name: Release

# Push a tag like v1.0.0 to build a signed APK and publish a GitHub Release.
# Requires the SIGNING_* secrets to be set in repository settings.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and create Release
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK_PATH"
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "::warning::Signing secrets missing - APK is unsigned and cannot be installed."
          fi

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.APK_PATH }}
