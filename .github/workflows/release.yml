name: Release

# Publishes a signed APK as a GitHub Release.
# Triggers: a push of a v* tag, or a push that touches the RELEASE file.
# The tag is derived from versionName in app/build.gradle.kts; the release
# action creates the tag itself when it does not exist yet.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'RELEASE'

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version tag
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "TAG=v${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Releasing ${{ env.TAG }}"

      - name: Skip if this tag is already released
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.setFailed('Release ' + tag + ' already exists; bump versionName to publish a new one.');
            } catch (e) {
              if (e.status === 404) core.info('No existing release for ' + tag + ', proceeding.');
              else throw e;
            }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK_PATH"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: SalviaBrowxer ${{ env.TAG }}
          generate_release_notes: true
          files: ${{ env.APK_PATH }}
