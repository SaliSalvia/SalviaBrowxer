name: Release permission probe

# Temporary diagnostic (delete after use): runs only on this branch and answers, with the
# Actions GITHUB_TOKEN itself, exactly which of the three publishing operations fails on this
# repository — pushing a tag, creating a release on an existing tag, or creating a release that
# has to create its own tag (the softprops path the Release workflow used). Each step's failure
# is reported as a ::error:: annotation so the message survives in the run's annotations API.
# Everything it creates is deleted in the cleanup step.

on:
  push:
    branches:
      - arena/c1404c55-salviabrowxer

permissions:
  contents: write

jobs:
  probe:
    name: Probe tag and release permissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Probe 1 - can the token push a tag
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git tag "v-probe1-$GITHUB_RUN_ID"
          if out=$(git push origin "v-probe1-$GITHUB_RUN_ID" 2>&1); then
            echo "::notice::probe1 tag push OK"
          else
            echo "::error::probe1 tag push FAILED: $out"
            exit 1
          fi

      - name: Probe 2 - can the token create a release on an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "gh version: $(gh --version | head -1)"
          if out=$(gh release create "v-probe1-$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --title "probe 2" --notes "deleted by cleanup" 2>&1); then
            echo "::notice::probe2 release create on existing tag OK: $out"
          else
            echo "::error::probe2 release create on existing tag FAILED: $out"
            exit 1
          fi

      - name: Probe 3 - can the token create a release that creates its own tag, with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh release create "v-probe3-$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --title "probe 3" --notes "deleted by cleanup" --generate-notes 2>&1); then
            echo "::notice::probe3 release create with own tag and generated notes OK: $out"
          else
            echo "::error::probe3 release create with own tag FAILED: $out"
            exit 1
          fi

      - name: Probe 4 - can the token upload a release-sized asset (40 MB)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dd if=/dev/urandom of=probe-asset.bin bs=1M count=40 status=none
          ls -l probe-asset.bin
          if out=$(gh release create "v-probe4-$GITHUB_RUN_ID" probe-asset.bin --repo "$GITHUB_REPOSITORY" --title "probe 4" --notes "asset upload probe, deleted by cleanup" 2>&1); then
            echo "::notice::probe4 release create with 40MB asset upload OK: $out"
          else
            echo "::error::probe4 release create with asset upload FAILED: $out"
            # Second look: does a plain upload to an existing release work?
            gh release create "v-probe4b-$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --title "probe 4b" --notes "deleted by cleanup" >/dev/null 2>&1 || true
            if out2=$(gh release upload "v-probe4b-$GITHUB_RUN_ID" probe-asset.bin --clobber --repo "$GITHUB_REPOSITORY" 2>&1); then
              echo "::notice::probe4b upload to existing release OK (create-with-asset is the broken half): $out2"
            else
              echo "::error::probe4b upload to existing release FAILED too: $out2"
            fi
            exit 1
          fi

      - name: Cleanup
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v-probe1-$GITHUB_RUN_ID" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>&1 || true
          gh release delete "v-probe3-$GITHUB_RUN_ID" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>&1 || true
          gh release delete "v-probe4-$GITHUB_RUN_ID" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>&1 || true
          gh release delete "v-probe4b-$GITHUB_RUN_ID" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>&1 || true
          git push origin ":refs/tags/v-probe1-$GITHUB_RUN_ID" 2>&1 || true
          git push origin ":refs/tags/v-probe3-$GITHUB_RUN_ID" 2>&1 || true
          git push origin ":refs/tags/v-probe4-$GITHUB_RUN_ID" 2>&1 || true
          git push origin ":refs/tags/v-probe4b-$GITHUB_RUN_ID" 2>&1 || true
