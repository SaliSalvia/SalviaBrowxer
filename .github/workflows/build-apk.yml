name: Build SalviaBrowxser APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    # `secrets` cannot be referenced inside `if:` expressions, so the presence
    # check is computed once here and gated on the resulting env flag below.
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Robolectric runs the unit tests against Android SDK 36, whose sandbox
      # requires a Java 21 runtime. Gradle and AGP 9 also run fine on 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SalviaBrowxser-debug.apk
          ls -lh dist

      - name: Build Signed Release APK (if secrets configured)
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          gradle :app:assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk dist/SalviaBrowxser-release.apk
          ls -lh dist

      - name: Verify APK artifacts
        run: |
          set -e
          for apk in dist/*.apk; do
            test -s "$apk"
            echo "OK: $apk ($(stat -c%s "$apk") bytes)"
          done

      - name: Upload APK Artifact
        # Always publish whatever APKs were built, so a failing later step does
        # not throw away an installable build.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SalviaBrowxser-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
